<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#081733">
<title>Preguntón de Daniel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Puerta de Istar de Babilonia: ladrillo azul lapislázuli, leones y rosetas doradas. Un solo mundo nocturno, a propósito. */
:root{
  color-scheme: dark;
  --night:#081733; --night-2:#0e2549; --night-3:#143162; --lapis:#1d4f9f;
  --gold:#ebbb4d; --gold-deep:#b0791c; --sand:#f5e9c9; --sand-dim:#c4b894;
  --ember:#ee7258; --ok:#5cc593;
  --line:rgba(235,187,77,.32); --line-soft:rgba(245,233,201,.16);
  --font-display:'Cinzel',Georgia,'Times New Roman',serif;
  --font-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-block:0 28px;min-height:100vh;color:var(--sand);font-family:var(--font-body);font-size:17px;line-height:1.45;font-weight:600;
  background:radial-gradient(1200px 520px at 50% -140px, rgba(47,107,196,.38), transparent 70%),
    repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 38px), var(--night)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--night)}
h1,h2,h3{font-family:var(--font-display);margin:0;font-weight:800;letter-spacing:.01em;text-wrap:balance;line-height:1.15}
h1{font-size:clamp(2rem,7vw,3.2rem)} h2{font-size:1.35rem;color:var(--gold)}
p{margin:0} a{color:var(--gold)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:8px}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--sand-dim)} .small{font-size:.9rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.stack{display:grid;gap:20px} .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.center{text-align:center;justify-items:center}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--night);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:58px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--sand);font-family:var(--font-display);font-weight:800;font-size:1.05rem;white-space:nowrap}
.brand svg{width:34px;height:34px;flex:none}
.nav{display:flex;gap:4px;margin-left:auto}
.nav a{display:flex;align-items:center;padding:10px 16px;border-radius:10px;text-decoration:none;color:var(--sand-dim);font-weight:800;min-height:44px}
.nav a:hover{color:var(--sand);background:rgba(255,255,255,.05)}
.nav a[aria-current="page"]{color:#1a1202;background:var(--gold)}
.frieze{display:block;width:100%;height:30px}
.banner{background:rgba(238,114,88,.16);border-bottom:1px solid rgba(238,114,88,.5)}
.banner .wrap{padding-top:10px;padding-bottom:10px;font-size:.92rem}
main{padding-top:24px}
.view[hidden]{display:none!important}
.card{background:var(--night-2);border:1px solid var(--line-soft);border-radius:18px;padding:20px}
.card.gold{border-color:var(--line)}
.eyebrow{font-family:var(--font-display);font-weight:600;font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:.88rem;font-weight:800}
.pill .dot{width:9px;height:9px;border-radius:50%;background:var(--ok)} .pill.off .dot{background:var(--ember)}
.dot{width:14px;height:14px;border-radius:50%;flex:none;background:var(--gold)}

/* botones */
.btn{appearance:none;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 26px;border-radius:14px;font-weight:800;font-size:1.1rem;color:#1a1202;background:linear-gradient(#f6d06c,#dca836);box-shadow:0 4px 0 #85590f;text-decoration:none;transition:transform .08s}
.btn:hover{filter:brightness(1.06)} .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #85590f}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--sand);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:rgba(255,255,255,.06)}
.btn.danger{background:linear-gradient(#f58f78,#e0563c);box-shadow:0 4px 0 #8d2a17;color:#2a0903}
.btn.small{min-height:42px;padding:8px 16px;font-size:.95rem;box-shadow:none}
.btn.big{min-height:64px;font-size:1.3rem;padding:14px 36px}

/* inicio: bienvenida */
.hero{display:flex;align-items:center;gap:18px}
.hero .lion{width:92px;height:96px;flex:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.hero p{font-size:1.1rem}
label.field{display:grid;gap:8px;font-weight:800;font-size:1.1rem}
input[type=text],input[type=password],select{width:100%;min-height:54px;padding:10px 14px;border-radius:14px;background:var(--night);border:2px solid var(--line-soft);color:var(--sand);font-weight:800;font-size:1.1rem}
input::placeholder{color:#8e9bb7}
input:focus,select:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px rgba(235,187,77,.28)}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.team-opt{position:relative;display:block}
.team-opt input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.team-face{display:flex;align-items:center;justify-content:center;gap:8px;min-height:60px;padding:10px 12px;border-radius:14px;background:var(--tc);color:#1a1202;font-weight:800;font-size:1.1rem;text-align:center;line-height:1.15;border:3px solid transparent;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.team-opt input:checked + .team-face{border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.35)}
.team-opt input:checked + .team-face::after{content:"✓";font-size:1.3rem}
.team-opt input:focus-visible + .team-face{outline:3px solid var(--gold);outline-offset:3px}
.err{color:var(--ember);font-weight:800}

/* inicio: renglones de juegos */
.hello{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.me-name{font-family:var(--font-display);font-weight:800;font-size:clamp(1.5rem,5vw,2.1rem);line-height:1.1}
.tchip{display:inline-flex;align-items:center;padding:6px 16px;border-radius:999px;background:var(--tc);color:#1a1202;font-weight:800}
.pts-chip{font-family:var(--font-display);font-weight:800;font-size:1.3rem;color:var(--gold)}
.lane{background:var(--night-2);border:1px solid var(--line);border-radius:22px;padding:18px;display:grid;gap:14px}
.lane-head{display:flex;align-items:center;gap:14px}
.lane-ic{width:52px;height:52px;border-radius:50%;flex:none;background:var(--gold);color:#1a1202;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:1.9rem;box-shadow:0 0 0 4px rgba(235,187,77,.25)}
.lane-ic svg{width:30px;height:30px}
.lane h2{font-size:1.6rem;color:var(--sand)}
.lvls{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lvl{display:grid;gap:8px;padding:16px;border-radius:18px;text-decoration:none;box-shadow:0 5px 0 rgba(0,0,0,.35);transition:transform .08s}
.lvl:hover{filter:brightness(1.07)} .lvl:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.lvl.medio{background:linear-gradient(160deg,#3a77d1,#1d4f9f);color:#fff}
.lvl.alto{background:linear-gradient(160deg,#f6d06c,#dca836);color:#1a1202}
.lvl .stars{letter-spacing:4px;font-size:1.05rem}
.lvl b{font-family:var(--font-display);font-size:1.6rem;line-height:1}
.lvl .of{font-size:.95rem;font-weight:800;opacity:.92}
.lvl .bar{height:9px;border-radius:99px;background:rgba(0,0,0,.3);overflow:hidden}
.lvl .bar i{display:block;height:100%;background:#fff;border-radius:99px}
.lvl.alto .bar i{background:#1a1202}
.lvl.off{filter:grayscale(.8);opacity:.5;pointer-events:none}
.tip{text-align:center}

/* juego */
.game{max-width:700px;margin:0 auto;display:grid;gap:16px}
.gtop{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);text-decoration:none;color:var(--sand);font-weight:800}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;background:var(--night-3);font-weight:800;font-size:.95rem}
.chip.medio{background:#1d4f9f;color:#fff} .chip.alto{background:var(--gold);color:#1a1202}
.meter{height:10px;border-radius:999px;background:var(--night);border:1px solid var(--line-soft);overflow:hidden}
.meter>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-deep),var(--gold));border-radius:999px}
.qcard{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:16px;align-items:start}
.cite{display:block;font-family:var(--font-display);font-weight:600;color:var(--gold);font-size:.95rem;margin-bottom:8px}
.qtext{font-size:1.3rem;line-height:1.4;font-weight:800}
.whoami{font-family:var(--font-display);font-weight:800;font-size:1.7rem;color:var(--sand);margin:0 0 12px;line-height:1.1}
.clues{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.clues li{position:relative;padding-left:30px;font-size:1.15rem;line-height:1.35;font-weight:800}
.clues li::before{content:"";position:absolute;left:2px;top:.32em;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle,var(--night) 0 3px,var(--gold) 4px);box-shadow:0 0 0 2px var(--gold-deep)}
.clues .src{display:inline-block;margin-left:4px;font-family:var(--font-display);font-weight:600;font-size:.78rem;letter-spacing:.04em;color:var(--gold);white-space:nowrap}
.ring{position:relative;width:96px;height:96px}
.ring svg{width:96px;height:96px;transform:rotate(-90deg)}
.ring .track{stroke:var(--night);fill:none;stroke-width:9}
.ring .bar{stroke:var(--gold);fill:none;stroke-width:9;stroke-linecap:round;stroke-dasharray:276.46;stroke-dashoffset:0}
.ring.low .bar{stroke:var(--ember)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-size:1.9rem;font-variant-numeric:tabular-nums}
.ring.low b{color:var(--ember);animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.14)}}
.opts{display:grid;gap:10px}
.opt{appearance:none;cursor:pointer;text-align:left;display:grid;grid-template-columns:42px minmax(0,1fr);gap:14px;align-items:center;min-height:64px;padding:10px 16px 10px 10px;border-radius:16px;border:2.5px solid var(--line-soft);background:var(--night-2);font-weight:800;font-size:1.15rem;line-height:1.3}
.opt .ltr{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--night-3);border:1.5px solid var(--line);font-family:var(--font-display);font-weight:800;color:var(--gold)}
button.opt:hover:not([disabled]){border-color:var(--gold);background:var(--night-3)}
.opt[disabled]{cursor:default}
.opt.picked{border-color:var(--gold);background:var(--night-3)}
.opt.right{border-color:var(--ok);background:rgba(92,197,147,.18)}
.opt.right .ltr{background:var(--ok);color:#06231a;border-color:var(--ok)}
.opt.wrong{border-color:var(--ember);background:rgba(238,114,88,.18)}
.opt.wrong .ltr{background:var(--ember);color:#2a0903;border-color:var(--ember)}
.opt.dim{opacity:.5}
.verdict{display:flex;align-items:center;gap:14px}
.verdict .lion{width:60px;height:62px;flex:none}
.verdict h2{font-size:1.7rem} .verdict.ok h2{color:var(--ok)} .verdict.bad h2{color:var(--ember)}
.verse{border-left:4px solid var(--gold);padding:4px 0 4px 14px;font-size:1.05rem}
.verse .ref{font-family:var(--font-display);font-weight:600;color:var(--gold);font-size:.9rem;display:block;margin-bottom:4px}
.whois{border:1.5px dashed var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:4px}
.whois b{font-family:var(--font-display);font-size:1.5rem;color:var(--gold);line-height:1.2}
.fade{animation:rise .28s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.credit{font-size:.78rem;color:var(--sand-dim)}
.stat{display:flex;flex-wrap:wrap;gap:26px;justify-content:center}
.stat div{display:grid;gap:2px} .stat b{font-family:var(--font-display);font-size:2.2rem;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1.1}

/* posiciones */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:6px 0 4px}
.pod{flex:1;max-width:190px;min-width:0;display:grid;gap:8px;text-align:center}
.pod .nm{font-weight:800;overflow-wrap:anywhere;line-height:1.2} .pod .pt{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:800}
.pod .col{border:2px solid var(--gold);border-bottom:0;border-radius:90px 90px 0 0;background:linear-gradient(180deg,var(--lapis),var(--night-2));display:flex;justify-content:center;padding-top:14px;height:var(--h)}
.pod .col b{font-family:var(--font-display);font-size:2rem;color:var(--gold);line-height:1}
.pod.first .col{--h:170px}.pod.second .col{--h:128px}.pod.third .col{--h:100px}
.ranks{display:grid;gap:8px;margin-top:6px}
.rrow{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border-radius:12px;background:var(--night);border:2px solid transparent}
.rrow.me{border-color:var(--gold);background:var(--night-3)}
.rrow .pos,.trow .pos{font-weight:800;color:var(--gold);font-size:1.1rem}
.rrow .who{display:grid;min-width:0} .rrow .who span{overflow-wrap:anywhere;font-weight:800}
.rrow .pts{font-variant-numeric:tabular-nums;font-weight:800}
.trow{display:grid;gap:8px;padding:12px 14px;border-radius:12px;background:var(--night);border:2px solid transparent}
.trow.me{border-color:var(--gold)}
.trow .head{display:flex;align-items:center;gap:12px}
.trow .head .pos{min-width:46px} .trow .head .tn{flex:1;min-width:0;font-weight:800;overflow-wrap:anywhere}
.trow .bar{height:12px;border-radius:999px;background:var(--night-2);overflow:hidden} .trow .bar i{display:block;height:100%;border-radius:999px}
.empty{padding:24px;text-align:center;border:1.5px dashed var(--line);border-radius:14px}

/* panel */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tile{padding:16px;border-radius:14px;background:var(--night);border:1px solid var(--line-soft);display:grid;gap:2px}
.tile b{font-family:var(--font-display);font-size:1.9rem;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1.1}
.tablewrap{overflow-x:auto;border:1px solid var(--line-soft);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:700px;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line-soft);vertical-align:top}
th{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);background:var(--night)}
td.num,th.num{text-align:right} tr.pl>td{background:var(--night-2)}
.xbtn{appearance:none;background:transparent;border:0;cursor:pointer;font-weight:800;text-align:left;padding:6px 0;min-height:36px;color:var(--sand);display:inline-flex;gap:8px;align-items:center}
.detail{display:grid;gap:6px;padding:6px 0}
.drow{display:grid;grid-template-columns:190px 120px minmax(0,1fr) 120px;gap:10px;font-size:.92rem;padding:6px 10px;border-radius:8px;background:var(--night)}
.tag{font-weight:800} .tag.ok{color:var(--ok)} .tag.bad{color:var(--ember)} .tag.to{color:var(--gold)}
.ctrl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.tbox{display:grid;gap:8px;padding:12px;border-radius:14px;background:var(--night);border:1px solid var(--line-soft)}
.tline{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:10px;align-items:center}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{appearance:none;width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer;background:var(--c)}
.sw[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.4)}
.hard{display:grid;gap:8px}
.hrow{display:grid;grid-template-columns:210px minmax(0,1fr) 120px;gap:12px;align-items:center;font-size:.92rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--night-3);border:1.5px solid var(--gold);padding:12px 18px;border-radius:12px;font-weight:800;max-width:min(92vw,520px)}

@media (max-width:760px){
  .grid2,.tiles{grid-template-columns:1fr}
  .qcard{grid-template-columns:1fr} .qcard .ring{order:-1;margin:0 auto}
  .drow{grid-template-columns:1fr 1fr} .hrow{grid-template-columns:120px minmax(0,1fr) 92px}
  main{padding-bottom:84px}
}
@media (max-width:640px){
  .top .wrap{min-height:54px}
  .nav{position:fixed;left:0;right:0;bottom:0;margin:0;z-index:25;justify-content:space-around;background:var(--night);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .nav a{flex:1;justify-content:center;padding:12px 4px}
  .lvl{padding:14px 12px} .lvl b{font-size:1.4rem}
  .hero .lion{width:72px;height:75px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

        <ellipse cx="60" cy="31" rx="9" ry="16" transform="rotate(195 60 63)"/><ellipse cx="60" cy="31" rx="9" ry="16" transform="rotate(225 60 63)"/>
        <ellipse cx="60" cy="31" rx="9" ry="16" transform="rotate(255 60 63)"/><ellipse cx="60" cy="31" rx="9" ry="16" transform="rotate(285 60 63)"/>
        <ellipse cx="60" cy="31" rx="9" ry="16" transform="rotate(315 60 63)"/><ellipse cx="60" cy="31" rx="9" ry="16" transform="rotate(345 60 63)"/>
      </g>
      <circle cx="37" cy="42" r="10" fill="#d89a2b"/><circle cx="83" cy="42" r="10" fill="#d89a2b"/>
      <circle cx="37" cy="42" r="5" fill="#7a4d0e"/><circle cx="83" cy="42" r="5" fill="#7a4d0e"/>

<script>
(function(){
'use strict';
const CONTENT = {"q": [{"id": "q01-7", "k": "q", "lv": "medio", "c": 1, "v": 7, "q": "¿qué nombre puso el jefe de los eunucos a Azarías?", "o": ["Abed-nego", "Sadrac", "Beltsasar", "Mesac"], "t": "A estos el jefe de los eunucos puso nombres: puso a Daniel, Beltsasar; a Ananías, Sadrac; a Misael, Mesac; y a Azarías, Abed-nego."}, {"id": "q01-8", "k": "q", "lv": "medio", "c": 1, "v": 8, "q": "¿qué propuso Daniel en su corazón?", "o": ["No contaminarse con la porción de la comida del rey", "Pedir al rey que lo dejara volver a Jerusalén", "Huir de Babilonia por la noche", "Ayunar cuarenta días en el palacio"], "t": "Y Daniel propuso en su corazón no contaminarse con la porción de la comida del rey, ni con el vino que él bebía; pidió, por tanto, al jefe de los eunucos que no se le obligase a contaminarse."}, {"id": "q01-11", "k": "q", "lv": "alto", "c": 1, "v": 11, "q": "¿quién estaba puesto por el jefe de los eunucos sobre Daniel y sus compañeros?", "o": ["Melsar", "Arioc", "Aspenaz", "Beltsasar"], "t": "Entonces dijo Daniel a Melsar, que estaba puesto por el jefe de los eunucos sobre Daniel, Ananías, Misael y Azarías:"}, {"id": "q01-12", "k": "q", "lv": "medio", "c": 1, "v": 12, "q": "¿por cuántos días pidió Daniel que se hiciera la prueba con sus siervos?", "o": ["Siete días", "Diez días", "Tres días", "Cuarenta días"], "t": "Te ruego que hagas la prueba con tus siervos por diez días, y nos den legumbres a comer, y agua a beber."}, {"id": "q01-17", "k": "q", "lv": "alto", "c": 1, "v": 17, "q": "¿en qué tuvo entendimiento Daniel?", "o": ["En toda visión y sueños", "En el gobierno de las provincias", "En los cantares del templo", "En el arte de la guerra"], "t": "A estos cuatro muchachos Dios les dio conocimiento e inteligencia en todas las letras y ciencias; y Daniel tuvo entendimiento en toda visión y sueños."}, {"id": "q01-20", "k": "q", "lv": "alto", "c": 1, "v": 20, "q": "¿cuántas veces mejores que todos los magos y astrólogos halló el rey a estos jóvenes?", "o": ["Dos veces mejores", "Cinco veces mejores", "Siete veces mejores", "Diez veces mejores"], "t": "En todo asunto de sabiduría e inteligencia que el rey les consultó, los halló diez veces mejores que todos los magos y astrólogos que había en todo su reino."}, {"id": "q02-1", "k": "q", "lv": "medio", "c": 2, "v": 1, "q": "¿en qué año del reinado de Nabucodonosor tuvo este rey sueños?", "o": ["En el tercer año", "En el séptimo año", "En el primer año", "En el segundo año"], "t": "En el segundo año del reinado de Nabucodonosor, tuvo Nabucodonosor sueños, y se perturbó su espíritu, y se le fue el sueño."}, {"id": "q02-4", "k": "q", "lv": "alto", "c": 2, "v": 4, "q": "¿en qué lengua hablaron los caldeos al rey?", "o": ["En hebreo", "En lengua aramea", "En persa", "En griego"], "t": "Entonces hablaron los caldeos al rey en lengua aramea: Rey, para siempre vive; di el sueño a tus siervos, y te mostraremos la interpretación."}, {"id": "q02-14", "k": "q", "lv": "alto", "c": 2, "v": 14, "q": "¿cómo se llamaba el capitán de la guardia del rey que salió para matar a los sabios?", "o": ["Melsar", "Arioc", "Joacim", "Aspenaz"], "t": "Entonces Daniel habló sabia y prudentemente a Arioc, capitán de la guardia del rey, que había salido para matar a los sabios de Babilonia."}, {"id": "q02-17", "k": "q", "lv": "medio", "c": 2, "v": 17, "q": "¿a quiénes hizo saber Daniel lo que había, para que pidiesen misericordias del Dios del cielo?", "o": ["Ananías, Misael y Azarías", "Joacim, Ciro y Darío", "Arioc, Aspenaz y Melsar", "Los magos, los astrólogos y los caldeos"], "t": "Luego se fue Daniel a su casa e hizo saber lo que había a Ananías, Misael y Azarías, sus compañeros,"}, {"id": "q02-34", "k": "q", "lv": "medio", "c": 2, "v": 34, "q": "¿qué hirió a la imagen en sus pies de hierro y de barro cocido?", "o": ["Un gran terremoto", "Una espada de fuego", "Un rayo del cielo", "Una piedra cortada, no con mano"], "t": "Estabas mirando, hasta que una piedra fue cortada, no con mano, e hirió a la imagen en sus pies de hierro y de barro cocido, y los desmenuzó."}, {"id": "q02-35", "k": "q", "lv": "alto", "c": 2, "v": 35, "q": "¿como qué quedaron el hierro, el barro, el bronce, la plata y el oro cuando la piedra hirió la imagen?", "o": ["Como polvo del desierto", "Como arena del mar", "Como tamo de las eras del verano", "Como ceniza del horno"], "t": "Entonces fueron desmenuzados también el hierro, el barro cocido, el bronce, la plata y el oro, y fueron como tamo de las eras del verano, y se los llevó el viento sin que de ellos quedara rastro alguno. Mas la piedra que hirió a la imagen fue hecha un gran monte que llenó toda la tierra."}, {"id": "q03-1", "k": "q", "lv": "medio", "c": 3, "v": 1, "q": "¿cuál era la altura de la estatua de oro que hizo el rey Nabucodonosor?", "o": ["Seis codos", "Cien codos", "Sesenta codos", "Treinta codos"], "t": "El rey Nabucodonosor hizo una estatua de oro cuya altura era de sesenta codos, y su anchura de seis codos; la levantó en el campo de Dura, en la provincia de Babilonia."}, {"id": "q03-5", "k": "q", "lv": "alto", "c": 3, "v": 5, "q": "¿cuál de estos instrumentos se menciona para adorar la estatua?", "o": ["El címbalo", "El laúd", "La zampoña", "La trompeta"], "t": "que al oír el son de la bocina, de la flauta, del tamboril, del arpa, del salterio, de la zampoña y de todo instrumento de música, os postréis y adoréis la estatua de oro que el rey Nabucodonosor ha levantado;"}, {"id": "q03-18", "k": "q", "lv": "medio", "c": 3, "v": 18, "q": "¿cómo continúa lo que dijeron Sadrac, Mesac y Abed-nego: «Y si no, sepas, oh rey, que…»?", "o": ["pediremos misericordia al rey", "no serviremos a tus dioses", "nuestro Dios no nos librará", "nos postraremos ante tu estatua"], "t": "Y si no, sepas, oh rey, que no serviremos a tus dioses, ni tampoco adoraremos la estatua que has levantado."}, {"id": "q03-19", "k": "q", "lv": "medio", "c": 3, "v": 19, "q": "¿cuántas veces más de lo acostumbrado mandó Nabucodonosor que se calentase el horno?", "o": ["Tres veces más", "Diez veces más", "Dos veces más", "Siete veces más"], "t": "Entonces Nabucodonosor se llenó de ira, y se demudó el aspecto de su rostro contra Sadrac, Mesac y Abed-nego, y ordenó que el horno se calentase siete veces más de lo acostumbrado."}, {"id": "q03-22", "k": "q", "lv": "alto", "c": 3, "v": 22, "q": "¿qué pasó con los hombres que alzaron a Sadrac, Mesac y Abed-nego?", "o": ["Se quemaron las manos", "Cayeron dormidos", "Huyeron del horno", "La llama del fuego los mató"], "t": "Y como la orden del rey era apremiante, y lo habían calentado mucho, la llama del fuego mató a aquellos que habían alzado a Sadrac, Mesac y Abed-nego."}, {"id": "q03-27", "k": "q", "lv": "alto", "c": 3, "v": 27, "q": "¿qué ni siquiera tenían estos varones al salir del horno?", "o": ["Olor de fuego", "Un solo hilo suelto", "Señales de hollín", "Rastro de ceniza"], "t": "Y se juntaron los sátrapas, los gobernadores, los capitanes y los consejeros del rey, para mirar a estos varones, cómo el fuego no había tenido poder alguno sobre sus cuerpos, ni aun el cabello de sus cabezas se había quemado; sus ropas estaban intactas, y ni siquiera olor de fuego tenían."}, {"id": "q04-10", "k": "q", "lv": "medio", "c": 4, "v": 10, "q": "¿qué le parecía ver a Nabucodonosor en medio de la tierra?", "o": ["Un río de fuego", "Un árbol de gran altura", "Una montaña de oro", "Una torre hasta el cielo"], "t": "Estas fueron las visiones de mi cabeza mientras estaba en mi cama: Me parecía ver en medio de la tierra un árbol, cuya altura era grande."}, {"id": "q04-16", "k": "q", "lv": "medio", "c": 4, "v": 16, "q": "¿cuántos tiempos pasarían sobre aquel cuyo corazón de hombre fuese cambiado por corazón de bestia?", "o": ["Siete tiempos", "Doce tiempos", "Tres tiempos", "Cuarenta tiempos"], "t": "Su corazón de hombre sea cambiado, y le sea dado corazón de bestia, y pasen sobre él siete tiempos."}, {"id": "q04-19", "k": "q", "lv": "alto", "c": 4, "v": 19, "q": "¿cuánto tiempo quedó atónito Daniel, cuyo nombre era Beltsasar?", "o": ["Tres días", "Siete días", "Casi una hora", "Toda la noche"], "t": "Entonces Daniel, cuyo nombre era Beltsasar, quedó atónito casi una hora, y sus pensamientos lo turbaban. El rey habló y dijo: Beltsasar, no te turben ni el sueño ni su interpretación. Beltsasar respondió y dijo: Señor mío, el sueño sea para tus enemigos, y su interpretación para los que mal te quieren."}, {"id": "q04-27", "k": "q", "lv": "alto", "c": 4, "v": 27, "q": "¿qué consejo dio Daniel al rey sobre sus pecados?", "o": ["Regalar su oro a los pobres", "Redimirlos con justicia y haciendo misericordias con los oprimidos", "Ofrecer sacrificios en el templo", "Pedir perdón a todo el pueblo"], "t": "Por tanto, oh rey, acepta mi consejo: tus pecados redime con justicia, y tus iniquidades haciendo misericordias para con los oprimidos, pues tal vez será eso una prolongación de tu tranquilidad."}, {"id": "q04-29", "k": "q", "lv": "alto", "c": 4, "v": 29, "q": "¿al cabo de cuántos meses paseaba el rey en el palacio real de Babilonia?", "o": ["Doce meses", "Siete meses", "Cuarenta días", "Tres meses"], "t": "Al cabo de doce meses, paseando en el palacio real de Babilonia,"}, {"id": "q04-33", "k": "q", "lv": "medio", "c": 4, "v": 33, "q": "¿como qué creció el pelo de Nabucodonosor?", "o": ["Como espinas del campo", "Como plumas de águila", "Como crines de león", "Como lana limpia"], "t": "En la misma hora se cumplió la palabra sobre Nabucodonosor, y fue echado de entre los hombres; y comía hierba como los bueyes, y su cuerpo se mojaba con el rocío del cielo, hasta que su pelo creció como plumas de águila, y sus uñas como las de las aves."}, {"id": "q05-1", "k": "q", "lv": "medio", "c": 5, "v": 1, "q": "¿a cuántos de sus príncipes hizo un gran banquete el rey Belsasar?", "o": ["A setenta", "A diez mil", "A mil", "A cien"], "t": "El rey Belsasar hizo un gran banquete a mil de sus príncipes, y en presencia de los mil bebía vino."}, {"id": "q05-5", "k": "q", "lv": "medio", "c": 5, "v": 5, "q": "¿qué aparecieron en aquella misma hora, escribiendo sobre lo encalado de la pared del palacio real?", "o": ["Un ángel con una espada", "Una nube de fuego", "Los ojos de un león", "Los dedos de una mano de hombre"], "t": "En aquella misma hora aparecieron los dedos de una mano de hombre, que escribía delante del candelero sobre lo encalado de la pared del palacio real, y el rey veía la mano que escribía."}, {"id": "q05-7", "k": "q", "lv": "alto", "c": 5, "v": 7, "q": "¿qué lugar en el reino prometió el rey a quien leyera la escritura?", "o": ["El tercer señor", "Jefe de los magos", "El segundo señor", "Gobernador de Babilonia"], "t": "El rey gritó en alta voz que hiciesen venir magos, caldeos y adivinos; y dijo el rey a los sabios de Babilonia: Cualquiera que lea esta escritura y me muestre su interpretación, será vestido de púrpura, y un collar de oro llevará en su cuello, y será el tercer señor en el reino."}, {"id": "q05-25", "k": "q", "lv": "alto", "c": 5, "v": 25, "q": "¿cuál fue la escritura que trazó la mano?", "o": ["MENE, MENE, TEKEL, UPARSIN", "TEKEL, TEKEL, MENE, PERES", "MENE, PERES, PERES, UPARSIN", "UPARSIN, TEKEL, MENE, MENE"], "t": "Y la escritura que trazó es: MENE, MENE, TEKEL, UPARSIN."}, {"id": "q05-27", "k": "q", "lv": "medio", "c": 5, "v": 27, "q": "¿qué significa TEKEL, según la interpretación de Daniel?", "o": ["Has sido medido en la ley, y fuiste hallado fiel", "Tu reino ha sido roto, y dado a los medos y a los persas", "Pesado has sido en balanza, y fuiste hallado falto", "Contó Dios tu reino, y le ha puesto fin"], "t": "TEKEL: Pesado has sido en balanza, y fuiste hallado falto."}, {"id": "q05-31", "k": "q", "lv": "alto", "c": 5, "v": 31, "q": "¿de cuántos años era Darío de Media cuando tomó el reino?", "o": ["Cuarenta y dos años", "Cincuenta y dos años", "Setenta años", "Sesenta y dos años"], "t": "Y Darío de Media tomó el reino, siendo de sesenta y dos años."}, {"id": "q06-1", "k": "q", "lv": "medio", "c": 6, "v": 1, "q": "¿cuántos sátrapas constituyó Darío sobre el reino?", "o": ["Mil", "Doce", "Ciento veinte", "Setenta"], "t": "Pareció bien a Darío constituir sobre el reino ciento veinte sátrapas, que gobernasen en todo el reino."}, {"id": "q06-2", "k": "q", "lv": "alto", "c": 6, "v": 2, "q": "¿cuántos gobernadores puso Darío sobre los sátrapas, y Daniel era uno de ellos?", "o": ["Tres", "Cuarenta", "Siete", "Doce"], "t": "Y sobre ellos tres gobernadores, de los cuales Daniel era uno, a quienes estos sátrapas diesen cuenta, para que el rey no fuese perjudicado."}, {"id": "q06-7", "k": "q", "lv": "medio", "c": 6, "v": 7, "q": "¿durante cuántos días no se podía pedir nada a ningún dios u hombre fuera del rey, so pena de ser echado al foso de los leones?", "o": ["Treinta días", "Siete días", "Cuarenta días", "Sesenta días"], "t": "Todos los gobernadores del reino, magistrados, sátrapas, príncipes y capitanes han acordado por consejo que promulgues un edicto real y lo confirmes, que cualquiera que en el espacio de treinta días demande petición de cualquier dios u hombre fuera de ti, oh rey, sea echado en el foso de los leones."}, {"id": "q06-10", "k": "q", "lv": "medio", "c": 6, "v": 10, "q": "¿hacia qué ciudad daban las ventanas abiertas de la cámara de Daniel cuando él oraba?", "o": ["Susa", "Belén", "Babilonia", "Jerusalén"], "t": "Cuando Daniel supo que el edicto había sido firmado, entró en su casa, y abiertas las ventanas de su cámara que daban hacia Jerusalén, se arrodillaba tres veces al día, y oraba y daba gracias delante de su Dios, como lo solía hacer antes."}, {"id": "q06-17", "k": "q", "lv": "alto", "c": 6, "v": 17, "q": "¿con qué selló el rey la piedra puesta sobre la puerta del foso?", "o": ["Con la firma de los sátrapas", "Con su anillo y con el anillo de sus príncipes", "Con una cadena de bronce", "Con cera y con su corona"], "t": "Y fue traída una piedra y puesta sobre la puerta del foso, la cual selló el rey con su anillo y con el anillo de sus príncipes, para que el acuerdo acerca de Daniel no se alterase."}, {"id": "q06-24", "k": "q", "lv": "alto", "c": 6, "v": 24, "q": "¿qué hicieron los leones con los acusadores de Daniel antes de que llegaran al fondo del foso?", "o": ["Los dejaron ir", "Quebraron todos sus huesos", "Los asustaron sin tocarlos", "Se durmieron"], "t": "Y dio orden el rey, y fueron traídos aquellos hombres que habían acusado a Daniel, y fueron echados en el foso de los leones ellos, sus hijos y sus mujeres; y aún no habían llegado al fondo del foso, cuando los leones se apoderaron de ellos y quebraron todos sus huesos."}, {"id": "q07-4", "k": "q", "lv": "medio", "c": 7, "v": 4, "q": "¿cómo era la primera bestia?", "o": ["Como oso, con tres costillas entre los dientes", "Como macho cabrío, con un cuerno notable", "Como leopardo, con cuatro alas de ave", "Como león, y tenía alas de águila"], "t": "La primera era como león, y tenía alas de águila. Yo estaba mirando hasta que sus alas fueron arrancadas, y fue levantada del suelo y se puso enhiesta sobre los pies a manera de hombre, y le fue dado corazón de hombre."}, {"id": "q07-5", "k": "q", "lv": "alto", "c": 7, "v": 5, "q": "¿cuántas costillas tenía entre los dientes la segunda bestia?", "o": ["Siete", "Tres", "Doce", "Cuatro"], "t": "Y he aquí otra segunda bestia, semejante a un oso, la cual se alzaba de un costado más que del otro, y tenía en su boca tres costillas entre los dientes; y le fue dicho así: Levántate, devora mucha carne."}, {"id": "q07-6", "k": "q", "lv": "alto", "c": 7, "v": 6, "q": "¿cuántas cabezas tenía la bestia semejante a un leopardo?", "o": ["Diez", "Cuatro", "Siete", "Tres"], "t": "Después de esto miré, y he aquí otra, semejante a un leopardo, con cuatro alas de ave en sus espaldas; tenía también esta bestia cuatro cabezas; y le fue dado dominio."}, {"id": "q07-7", "k": "q", "lv": "medio", "c": 7, "v": 7, "q": "¿cuántos cuernos tenía la cuarta bestia?", "o": ["Cuatro", "Doce", "Diez", "Siete"], "t": "Después de esto miraba yo en las visiones de la noche, y he aquí la cuarta bestia, espantosa y terrible y en gran manera fuerte, la cual tenía unos dientes grandes de hierro; devoraba y desmenuzaba, y las sobras hollaba con sus pies, y era muy diferente de todas las bestias que vi antes de ella, y tenía diez cuernos."}, {"id": "q07-9", "k": "q", "lv": "medio", "c": 7, "v": 9, "q": "¿cómo era el vestido del Anciano de días?", "o": ["Azul como el cielo", "Rojo como el fuego", "Blanco como la nieve", "Púrpura como el oro"], "t": "Estuve mirando hasta que fueron puestos tronos, y se sentó un Anciano de días, cuyo vestido era blanco como la nieve, y el pelo de su cabeza como lana limpia; su trono llama de fuego, y las ruedas del mismo, fuego ardiente."}, {"id": "q07-14", "k": "q", "lv": "alto", "c": 7, "v": 14, "q": "¿qué le fue dado al que venía como un hijo de hombre?", "o": ["Dominio, gloria y reino", "Una corona de oro y un cetro", "Fuerza, riquezas y honra", "Un libro sellado y una espada"], "t": "Y le fue dado dominio, gloria y reino, para que todos los pueblos, naciones y lenguas le sirvieran; su dominio es dominio eterno, que nunca pasará, y su reino uno que no será destruido."}, {"id": "q08-2", "k": "q", "lv": "alto", "c": 8, "v": 2, "q": "¿en qué ciudad estaba Daniel, junto al río Ulai, cuando vio la visión?", "o": ["En Jerusalén", "En Babilonia", "En Nínive", "En Susa"], "t": "Vi en visión; y cuando la vi, yo estaba en Susa, que es la capital del reino en la provincia de Elam; vi, pues, en visión, estando junto al río Ulai."}, {"id": "q08-14", "k": "q", "lv": "alto", "c": 8, "v": 14, "q": "¿hasta cuántas tardes y mañanas dijo el santo que duraría esto, y luego el santuario sería purificado?", "o": ["Mil doscientas noventa", "Dos mil trescientas", "Setenta", "Mil trescientas treinta y cinco"], "t": "Y él dijo: Hasta dos mil trescientas tardes y mañanas; luego el santuario será purificado."}, {"id": "q08-16", "k": "q", "lv": "medio", "c": 8, "v": 16, "q": "¿a quién gritó la voz de hombre: «enseña a este la visión»?", "o": ["A Miguel", "A Belsasar", "A Arioc", "A Gabriel"], "t": "Y oí una voz de hombre entre las riberas del Ulai, que gritó y dijo: Gabriel, enseña a este la visión."}, {"id": "q08-20", "k": "q", "lv": "medio", "c": 8, "v": 20, "q": "¿a quiénes representaban los dos cuernos del carnero?", "o": ["A los reyes del sur y del norte", "A los reyes de Grecia", "A los reyes de Egipto y de Babilonia", "A los reyes de Media y de Persia"], "t": "En cuanto al carnero que viste, que tenía dos cuernos, estos son los reyes de Media y de Persia."}, {"id": "q08-21", "k": "q", "lv": "medio", "c": 8, "v": 21, "q": "¿a quién representaba el macho cabrío?", "o": ["Al rey de Babilonia", "Al rey de Egipto", "Al rey de Grecia", "Al rey de Persia"], "t": "El macho cabrío es el rey de Grecia, y el cuerno grande que tenía entre sus ojos es el rey primero."}, {"id": "q08-27", "k": "q", "lv": "alto", "c": 8, "v": 27, "q": "¿qué le pasó a Daniel después de la visión?", "o": ["Quedó mudo tres semanas", "Huyó de Babilonia", "Perdió la vista", "Quedó quebrantado y estuvo enfermo algunos días"], "t": "Y yo Daniel quedé quebrantado, y estuve enfermo algunos días, y cuando convalecí, atendí los negocios del rey; pero estaba espantado a causa de la visión, y no la entendía."}, {"id": "q09-1", "k": "q", "lv": "alto", "c": 9, "v": 1, "q": "¿de quién era hijo Darío, que vino a ser rey sobre el reino de los caldeos?", "o": ["De Belsasar", "De Asuero", "De Ciro", "De Nabucodonosor"], "t": "En el año primero de Darío hijo de Asuero, de la nación de los medos, que vino a ser rey sobre el reino de los caldeos,"}, {"id": "q09-2", "k": "q", "lv": "medio", "c": 9, "v": 2, "q": "¿en cuántos años habían de cumplirse las desolaciones de Jerusalén, según lo que habló Jehová al profeta Jeremías?", "o": ["Cien años", "Cuarenta años", "Siete años", "Setenta años"], "t": "en el año primero de su reinado, yo Daniel miré atentamente en los libros el número de los años de que habló Jehová al profeta Jeremías, que habían de cumplirse las desolaciones de Jerusalén en setenta años."}, {"id": "q09-3", "k": "q", "lv": "medio", "c": 9, "v": 3, "q": "¿cómo buscó Daniel a Dios el Señor?", "o": ["En oración y ruego, en ayuno, cilicio y ceniza", "Con cantos y arpas en el palacio", "Con sacrificios en el templo", "Con ofrendas de incienso y de oro"], "t": "Y volví mi rostro a Dios el Señor, buscándole en oración y ruego, en ayuno, cilicio y ceniza."}, {"id": "q09-21", "k": "q", "lv": "alto", "c": 9, "v": 21, "q": "¿a qué hora vino el varón Gabriel a Daniel, volando con presteza?", "o": ["A la medianoche", "Al amanecer", "Al mediodía", "A la hora del sacrificio de la tarde"], "t": "aún estaba hablando en oración, cuando el varón Gabriel, a quien había visto en la visión al principio, volando con presteza, vino a mí como a la hora del sacrificio de la tarde."}, {"id": "q09-23", "k": "q", "lv": "medio", "c": 9, "v": 23, "q": "¿cómo le dijo Gabriel que era Daniel?", "o": ["Muy valiente", "Muy sabio", "Muy amado", "Muy fiel"], "t": "Al principio de tus ruegos fue dada la orden, y yo he venido para enseñártela, porque tú eres muy amado. Entiende, pues, la orden, y entiende la visión."}, {"id": "q09-24", "k": "q", "lv": "alto", "c": 9, "v": 24, "q": "¿cuántas semanas están determinadas sobre el pueblo de Daniel y su santa ciudad?", "o": ["Setenta años", "Setenta semanas", "Siete semanas", "Sesenta y dos semanas"], "t": "Setenta semanas están determinadas sobre tu pueblo y sobre tu santa ciudad, para terminar la prevaricación, y poner fin al pecado, y expiar la iniquidad, para traer la justicia perdurable, y sellar la visión y la profecía, y ungir al Santo de los santos."}, {"id": "q10-2", "k": "q", "lv": "medio", "c": 10, "v": 2, "q": "¿por cuánto tiempo estuvo afligido Daniel en aquellos días?", "o": ["Cuarenta días", "Siete días", "Setenta semanas", "Tres semanas"], "t": "En aquellos días yo Daniel estuve afligido por espacio de tres semanas."}, {"id": "q10-3", "k": "q", "lv": "alto", "c": 10, "v": 3, "q": "¿qué no comió Daniel durante las tres semanas?", "o": ["Pan ni agua", "Solo legumbres", "Manjar delicado", "Higos ni dátiles"], "t": "No comí manjar delicado, ni entró en mi boca carne ni vino, ni me ungí con ungüento, hasta que se cumplieron las tres semanas."}, {"id": "q10-4", "k": "q", "lv": "medio", "c": 10, "v": 4, "q": "¿a la orilla de qué río estaba Daniel el día veinticuatro del mes primero?", "o": ["El río Jordán", "El gran río Hidekel", "El río Éufrates", "El río Ulai"], "t": "Y el día veinticuatro del mes primero estaba yo a la orilla del gran río Hidekel."}, {"id": "q10-5", "k": "q", "lv": "medio", "c": 10, "v": 5, "q": "¿de qué estaba vestido el varón que Daniel vio?", "o": ["De piel", "De púrpura", "De lino", "De escarlata"], "t": "Y alcé mis ojos y miré, y he aquí un varón vestido de lino, y ceñidos sus lomos de oro de Ufaz."}, {"id": "q10-13", "k": "q", "lv": "alto", "c": 10, "v": 13, "q": "¿durante cuántos días se opuso el príncipe del reino de Persia al que hablaba con Daniel?", "o": ["Treinta días", "Veintiún días", "Siete días", "Cuarenta días"], "t": "Mas el príncipe del reino de Persia se me opuso durante veintiún días; pero he aquí Miguel, uno de los principales príncipes, vino para ayudarme, y quedé allí con los reyes de Persia."}, {"id": "q10-21", "k": "q", "lv": "alto", "c": 10, "v": 21, "q": "¿quién era el único que ayudaba al que hablaba con Daniel contra ellos?", "o": ["Gabriel", "Arioc", "Miguel, vuestro príncipe", "Darío"], "t": "Pero yo te declararé lo que está escrito en el libro de la verdad; y ninguno me ayuda contra ellos, sino Miguel vuestro príncipe."}, {"id": "q11-1", "k": "q", "lv": "medio", "c": 11, "v": 1, "q": "¿en qué año de Darío el medo dice que estuvo para animarlo y fortalecerlo?", "o": ["En el año séptimo", "En el año sesenta y dos", "En el año tercero", "En el año primero"], "t": "Y yo mismo, en el año primero de Darío el medo, estuve para animarlo y fortalecerlo."}, {"id": "q11-2", "k": "q", "lv": "medio", "c": 11, "v": 2, "q": "¿cuántos reyes aún habría en Persia, además del cuarto que se haría de grandes riquezas?", "o": ["Siete reyes", "Tres reyes", "Cuatro reyes", "Dos reyes"], "t": "Y ahora yo te mostraré la verdad. He aquí que aún habrá tres reyes en Persia, y el cuarto se hará de grandes riquezas más que todos ellos; y al hacerse fuerte con sus riquezas, levantará a todos contra el reino de Grecia."}, {"id": "q11-21", "k": "q", "lv": "alto", "c": 11, "v": 21, "q": "¿cómo se llama al que sucederá en su lugar, a quien no darán la honra del reino?", "o": ["Un príncipe del pacto", "Un hombre despreciable", "Un cobrador de tributos", "Un rey valiente"], "t": "Y le sucederá en su lugar un hombre despreciable, al cual no darán la honra del reino; pero vendrá sin aviso y tomará el reino con halagos."}, {"id": "q11-30", "k": "q", "lv": "alto", "c": 11, "v": 30, "q": "¿de dónde vendrían las naves contra él?", "o": ["De Tarsis", "De Sidón", "De Quitim", "De Egipto"], "t": "Porque vendrán contra él naves de Quitim, y él se contristará, y volverá, y se enojará contra el pacto santo, y hará según su voluntad; volverá, pues, y se entenderá con los que abandonen el santo pacto."}, {"id": "q11-32", "k": "q", "lv": "medio", "c": 11, "v": 32, "q": "¿qué hará el pueblo que conoce a su Dios?", "o": ["Pedirá paz al rey", "Huirá a los montes", "Callará y esperará", "Se esforzará y actuará"], "t": "Con lisonjas seducirá a los violadores del pacto; mas el pueblo que conoce a su Dios se esforzará y actuará."}, {"id": "q11-41", "k": "q", "lv": "alto", "c": 11, "v": 41, "q": "¿de quién serían la mayoría de los hijos que escaparían de su mano, junto con Edom y Moab?", "o": ["De Egipto", "De Amón", "De Etiopía", "De Libia"], "t": "Entrará a la tierra gloriosa, y muchas provincias caerán; mas estas escaparán de su mano: Edom y Moab, y la mayoría de los hijos de Amón."}, {"id": "q12-1", "k": "q", "lv": "medio", "c": 12, "v": 1, "q": "¿quién se levantaría, el gran príncipe que está de parte de los hijos del pueblo de Daniel?", "o": ["Miguel", "Gabriel", "Beltsasar", "Arioc"], "t": "En aquel tiempo se levantará Miguel, el gran príncipe que está de parte de los hijos de tu pueblo; y será tiempo de angustia, cual nunca fue desde que hubo gente hasta entonces; pero en aquel tiempo será libertado tu pueblo, todos los que se hallen escritos en el libro."}, {"id": "q12-2", "k": "q", "lv": "medio", "c": 12, "v": 2, "q": "¿para qué serán despertados unos de los que duermen en el polvo de la tierra, mientras otros lo serán para vergüenza y confusión perpetua?", "o": ["Para vida eterna", "Para reinar en Babilonia", "Para heredar la tierra de Judá", "Para el servicio del templo"], "t": "Y muchos de los que duermen en el polvo de la tierra serán despertados, unos para vida eterna, y otros para vergüenza y confusión perpetua."}, {"id": "q12-3", "k": "q", "lv": "medio", "c": 12, "v": 3, "q": "¿como qué resplandecerán los entendidos?", "o": ["Como el sol del mediodía", "Como lámparas de bronce", "Como el resplandor del firmamento", "Como el oro fino"], "t": "Los entendidos resplandecerán como el resplandor del firmamento; y los que enseñan la justicia a la multitud, como las estrellas a perpetua eternidad."}, {"id": "q12-4", "k": "q", "lv": "alto", "c": 12, "v": 4, "q": "¿qué le mandan a Daniel cerrar y sellar hasta el tiempo del fin?", "o": ["El decreto del rey", "La puerta del foso", "El templo de Jerusalén", "Las palabras y el libro"], "t": "Pero tú, Daniel, cierra las palabras y sella el libro hasta el tiempo del fin. Muchos correrán de aquí para allá, y la ciencia se aumentará."}, {"id": "q12-11", "k": "q", "lv": "alto", "c": 12, "v": 11, "q": "¿cuántos días habrá desde que sea quitado el continuo sacrificio hasta la abominación desoladora?", "o": ["Mil doscientos noventa días", "Mil días", "Dos mil trescientos días", "Mil trescientos treinta y cinco días"], "t": "Y desde el tiempo que sea quitado el continuo sacrificio hasta la abominación desoladora, habrá mil doscientos noventa días."}, {"id": "q12-12", "k": "q", "lv": "alto", "c": 12, "v": 12, "q": "¿a cuántos días llegará el bienaventurado que espere?", "o": ["Mil trescientos treinta y cinco días", "Dos mil trescientos días", "Setenta días", "Mil doscientos noventa días"], "t": "Bienaventurado el que espere, y llegue a mil trescientos treinta y cinco días."}], "p": [{"id": "p-nabucodonosor", "k": "p", "lv": "medio", "c": 0, "cl": ["Rey de Babilonia que sitió Jerusalén.", "Hizo una estatua de oro de sesenta codos.", "Comió hierba como los bueyes."], "rf": ["1:1", "3:1", "4:33"], "o": ["Ciro", "Nabucodonosor", "Belsasar", "Darío"]}, {"id": "p-belsasar", "k": "p", "lv": "medio", "c": 0, "cl": ["Hizo un banquete a mil príncipes.", "Usó los vasos del templo de Jerusalén.", "Murió la misma noche de la escritura en la pared."], "rf": ["5:1", "5:2", "5:30"], "o": ["Ciro", "Darío", "Belsasar", "Nabucodonosor"]}, {"id": "p-dario", "k": "p", "lv": "medio", "c": 0, "cl": ["Medo que tomó el reino a los sesenta y dos años.", "Puso ciento veinte sátrapas.", "Se acostó ayuno la noche del foso."], "rf": ["5:31", "6:1", "6:18"], "o": ["Ciro", "Darío", "Nabucodonosor", "Belsasar"]}, {"id": "p-ciro", "k": "p", "lv": "medio", "c": 0, "cl": ["Rey de Persia.", "Daniel prosperó durante su reinado.", "En su año tercero se reveló una palabra a Daniel."], "rf": ["10:1", "6:28", "10:1"], "o": ["Nabucodonosor", "Ciro", "Belsasar", "Darío"]}, {"id": "p-gabriel", "k": "p", "lv": "medio", "c": 0, "cl": ["Vino volando con presteza.", "Dio a Daniel sabiduría y entendimiento.", "Le dijo: «eres muy amado»."], "rf": ["9:21", "9:22", "9:23"], "o": ["Melsar", "Miguel", "Gabriel", "Arioc"]}, {"id": "p-miguel", "k": "p", "lv": "medio", "c": 0, "cl": ["Uno de los principales príncipes.", "Ayudó contra el príncipe de Persia.", "Gran príncipe a favor del pueblo de Daniel."], "rf": ["10:13", "10:13", "12:1"], "o": ["Arioc", "Aspenaz", "Miguel", "Gabriel"]}, {"id": "p-sadrac", "k": "p", "lv": "medio", "c": 0, "cl": ["Su nombre hebreo era Ananías.", "Cayó atado dentro del horno ardiendo.", "Dijo: «no serviremos a tus dioses»."], "rf": ["1:7", "3:23", "3:18"], "o": ["Sadrac", "Abed-nego", "Daniel", "Mesac"]}, {"id": "p-mesac", "k": "p", "lv": "medio", "c": 0, "cl": ["Su nombre hebreo era Misael.", "Fue acusado de no adorar la estatua de oro.", "Salió del horno sin olor de fuego."], "rf": ["1:7", "3:12", "3:27"], "o": ["Abed-nego", "Sadrac", "Arioc", "Mesac"]}, {"id": "p-abed-nego", "k": "p", "lv": "medio", "c": 0, "cl": ["Su nombre hebreo era Azarías.", "El rey preguntó: «¿qué dios os librará de mis manos?»", "Entregó su cuerpo antes que adorar a otro dios."], "rf": ["1:7", "3:15", "3:28"], "o": ["Sadrac", "Mesac", "Abed-nego", "Daniel"]}, {"id": "p-arioc", "k": "p", "lv": "medio", "c": 0, "cl": ["Capitán de la guardia del rey.", "Salió a matar a los sabios de Babilonia.", "Llevó prontamente a Daniel ante el rey."], "rf": ["2:14", "2:14", "2:25"], "o": ["Joacim", "Melsar", "Arioc", "Aspenaz"]}, {"id": "p-reina", "k": "p", "lv": "medio", "c": 0, "cl": ["Entró a la sala del banquete.", "Recordó a un hombre con el espíritu de los dioses santos.", "Aconsejó llamar a Daniel."], "rf": ["5:10", "5:11", "5:12"], "o": ["La reina", "Arioc", "Gabriel", "Belsasar"]}, {"id": "p-joacim", "k": "p", "lv": "medio", "c": 0, "cl": ["Rey de Judá.", "Un rey de Babilonia lo sitió en su año tercero.", "El Señor lo entregó con parte de los utensilios del templo."], "rf": ["1:1", "1:1", "1:2"], "o": ["Belsasar", "Asuero", "Ciro", "Joacim"]}, {"id": "p-aspenaz", "k": "p", "lv": "alto", "c": 0, "cl": ["Jefe de los eunucos del rey.", "Debía traer jóvenes sin tacha alguna.", "Temía por su cabeza ante el rey."], "rf": ["1:3", "1:4", "1:10"], "o": ["Melsar", "Joacim", "Aspenaz", "Arioc"]}, {"id": "p-melsar", "k": "p", "lv": "alto", "c": 0, "cl": ["Estaba puesto sobre Daniel y sus tres compañeros.", "Probó con ellos diez días.", "Les daba legumbres."], "rf": ["1:11", "1:14", " function hash(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function shuffle(arr, seed){ const a=arr.slice(), r=rng(seed); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ---------- configuración ---------- */
function defaultCfg(){ return { open:true, cards:true, from:1, to:CHAPTERS, secs:30, teams: TEAM_NAMES.map((name,i)=>({id:'t'+(i+1), name, color:PALETTE[i]})) }; }
function normCfg(d){
  const base = defaultCfg(); d = d || {};
  let from = Math.min(CHAPTERS, Math.max(1, parseInt(d.from,10)||1));
  let to = Math.min(CHAPTERS, Math.max(1, parseInt(d.to,10)||CHAPTERS));
  if (from>to) { const t=from; from=to; to=t; }
  const secs = SECS_OPTIONS.includes(d.secs) ? d.secs : 30;
  const teams = Array.isArray(d.teams) && d.teams.length>=2 ? d.teams.slice(0,8).map((t,i)=>({ id:String(t.id||('t'+(i+1))), name:String(t.name||('Equipo '+(i+1))).slice(0,24), color:safeColor(t.color) })) : base.teams;
  return { open: d.open!==false, cards: d.cards!==false, from, to, secs, teams };
}

/* ---------- servidor ---------- */
async function api(a, extra){
  const body = Object.assign({ a, pid: PID }, a.startsWith('admin_') ? { pin: state.pin } : {}, extra||{});
  let r;
  try { r = await fetch('/api/game', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) }); }
  catch(e){ const err = new Error('network'); err.network = true; throw err; }
  let j = null; try { j = await r.json(); } catch(e){}
  if (!r.ok) { const err = new Error((j && j.error) || 'Error del servidor'); err.status = r.status; err.code = j && j.code; throw err; }
  return j;
}
function applyMe(me){ if (!me) return; if (!state.me || (me.t||0) >= (state.me.t||0)) { state.me = me; state.items = me.items || {}; } }
function applyState(j){
  state.cfg = normCfg(j.cfg); state.board = j.board || [];
  if (j.me) applyMe(j.me); else if (!state.me) state.items = {};
  state.ready = true; state.err = ''; updateBanner();
}
async function refresh(){
  try { applyState(await api('state')); }
  catch(e){ state.ready = true; state.err = e.network ? 'Sin internet. Se reintenta solo.' : 'El servidor no respondió. Se reintenta solo.'; updateBanner(); }
  onData();
}

  if (!state.isAdmin) return;
  try { const j = await api('admin_players'); state.players = j.players || []; state.cardNames = j.cardNames || {}; state.cfg = normCfg(j.cfg); state.err=''; updateBanner(); }
  catch(e){ if (e.code==='bad_pin') { state.isAdmin=false; state.pin=''; ssSet('pd_pin',''); } else { state.err='No se pudo actualizar el panel.'; updateBanner(); } }

}

/* ---------- rutas ---------- */
let R = { name:'inicio', game:false };
function parseRoute(){
  const h = (location.hash||'').replace('#','');
  if (h==='inicio' || h==='posiciones' || h==='panel') return { name:h, game:false };
  const m = /^(preguntas|personajes)-(medio|alto)$/.exec(h);
  if (m) return { name:h, game:true, kind: m[1]==='preguntas'?'q':'p', level:m[2] };
  return { name:'inicio', game:false };
}
function route(){
  const prev = R; R = parseRoute();
  if (prev.game && prev.name!==R.name) stopTick();
  $('#v-inicio').hidden = R.name!=='inicio'; $('#v-juego').hidden = !R.game;
  $('#v-posiciones').hidden = R.name!=='posiciones'; $('#v-panel').hidden = R.name!=='panel';
  $$('.nav a').forEach(a => { if (a.dataset.r===(R.game?'inicio':R.name)) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  if (R.name==='inicio') renderInicio();
  if (R.game) { G.phase = 'loading'; renderGame(); }
  if (R.name==='posiciones') { renderPosiciones(); refresh(); }
  if (R.name==='panel') { renderPanelControls(); renderPanelData(); refreshAdmin(); }
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
setInterval(() => { if (document.hidden) return; if (R.name==='inicio' || R.name==='posiciones') refresh(); else if (R.name==='panel') refreshAdmin(); }, POLL_MS);

/* ---------- ranking ---------- */
function rankList(list, key){
  const sorted = list.slice().sort((a,b)=> (b[key]-a[key]) || String(a.name||'').localeCompare(String(b.name||''),'es'));
  let rank=0, last=null;
  return sorted.map((x,i)=>{ if (last===null || x[key]!==last){ rank=i+1; last=x[key]; } return Object.assign({}, x, {rank}); });
}
function teamTotals(){
  const m = {}; state.cfg.teams.forEach(t => m[t.id]={ id:t.id, name:t.name, color:t.color, pts:0, count:0 });
  state.board.forEach(s => { const t = m[s.team]; if (t){ t.pts += (s.pts||0); t.count++; } });
  return Object.values(m);
}

function lvlTile(kind, lv){

  const open = isOpen(kind) && pool.length>0; const full = pool.length>0 && done>=pool.length;
  const label = !pool.length ? 'Sin preguntas' : (!isOpen(kind) ? 'Cerrado' : (full ? '¡Completo!' : done+' de '+pool.length));
  const inner = `<span class="stars" aria-hidden="true">${'★'.repeat(LEVELS[lv].stars)}</span><b>${LEVELS[lv].name}</b><span class="of">${label}</span><span class="bar" aria-hidden="true"><i style="width:${pool.length?Math.round(done*100/pool.length):0}%"></i></span>`;
  return open ? `<a class="lvl ${lv}" href="${hashFor(kind,lv)}" aria-label="${KIND[kind].name}, nivel ${LEVELS[lv].name}. ${label}">${inner}</a>`
              : `<div class="lvl ${lv} off" aria-disabled="true">${inner}</div>`;
}

  const em = $('#editMe'); if (em) em.addEventListener('click', () => { draft = { name:me.name, team:me.team, editing:true, err:'' }; renderInicio(); setTimeout(()=>{const n=$('#nameInput'); if(n) n.focus();},0); });
}

/* ---------- JUEGO ---------- */
const G = { phase:'loading', q:null, deadline:0, secs:30, token:null, tick:null, opts:[], last:null, err:'' };
function stopTick(){ if (G.tick){ clearInterval(G.tick); G.tick=null; } }
const curPool = () => poolFor(R.kind, R.level);
function nextQuestion(){ return shuffle(curPool(), hash(PID+R.name)).find(q => !state.items[q.id]); }
function updateGameScore(){ const el = $('#gScore'); if (el) el.textContent = sumPts(state.items); }
const optsFor = q => shuffle(q.o, hash(PID+q.id));
const topBar = (extra) => `<div class="gtop"><a class="back" href="#inicio">← Salir</a><span class="chip ${R.level}">${KIND[R.kind].name} · ${LEVELS[R.level].name}</span>${extra||''}<span class="chip"><b id="gScore">${sumPts(state.items)}</b> pts</span></div>`;

function renderGame(){
  const root = $('#v-juego'); stopTick();
  if (!state.ready) { G.phase='loading'; root.innerHTML = `<div class="game">${loadingHtml()}</div>`; return; }
  if (!myProfile()) {
    G.phase='noprofile';
    root.innerHTML = `<div class="game"><div class="card center stack"><div style="width:84px">${LION('lion')}</div><h2>Primero entra con tu nombre</h2><a class="btn" href="#inicio">Ir al inicio</a></div></div>`;
    return;
  }
  // ¿había una pregunta en curso (por ejemplo, si recargaste la página)?
  const cur = lsGet('pd_cur', null);
  if (G.phase!=='question' && G.phase!=='feedback' && G.phase!=='sending' && cur && cur.pid===PID && !state.items[cur.q] && qById[cur.q]) {
    const cq = qById[cur.q];
    if (cq.k!==R.kind || cq.lv!==R.level) { location.hash = hashFor(cq.k, cq.lv); return; }
    G.q = cq; G.deadline = cur.deadline; G.secs = cur.secs; G.token = cur.token; G.opts = optsFor(cq);
    if (Date.now() >= G.deadline) { G.phase='question'; finalize(null, true); return; }
    G.phase='question'; renderQuestion(); startTick(); return;
  }
  if (G.phase==='feedback' && G.last) { renderFeedback(); return; }
  const pool = curPool(); const nxt = nextQuestion();
  if (!nxt) { G.phase='done'; return renderDone(pool); }
  if (!isOpen(R.kind)) {
    G.phase='closed';
    root.innerHTML = `<div class="game">${topBar()}<div class="card center stack"><div style="width:84px">${LION('lion')}</div><h2>Todavía no está abierto</h2><p class="muted">Espera la señal.</p></div></div>`;
    return;
  }
  G.phase='idle';
  root.innerHTML = `
    <div class="game fade">${topBar()}
      <div class="card gold center stack"><div style="width:110px">${LION('lion')}</div>
        <h1 style="font-size:clamp(1.8rem,6vw,2.5rem)">¿Listo?</h1>
        <p class="lead" style="font-size:1.2rem">${state.cfg.secs} segundos por ${KIND[R.kind].one}</p>
        <p class="err" id="startErr" role="alert" ${G.err?'':'hidden'}>${esc(G.err)}</p>
        <button class="btn big" id="goBtn" type="button">¡Empezar!</button></div>
    </div>`;
  $('#goBtn').addEventListener('click', () => beginQuestion(nxt));
}
async function beginQuestion(q){
  const btn = $('#goBtn') || $('#nextBtn'); if (btn) btn.disabled = true;
  try {
    const j = await api('start', { qid:q.id });
    G.q = q; G.secs = j.secs; G.token = j.token; G.deadline = Date.now() + j.left*1000; G.opts = optsFor(q); G.last = null; G.err=''; G.phase='question';
    lsSet('pd_cur', { pid:PID, q:q.id, token:j.token, deadline:G.deadline, secs:G.secs });
    renderQuestion(); startTick();
  } catch(e){
    if (btn) btn.disabled = false;
    G.err = e.network ? 'Sin internet. Inténtalo otra vez.' : e.message;
    if (['answered','closed','out_of_round'].includes(e.code)) { await refresh(); }
    if (G.phase==='feedback') toast(G.err); else { G.phase='loading'; renderGame(); }
  }
}
function renderQuestion(){
  const root = $('#v-juego'); const q = G.q; const pool = poolFor(q.k, q.lv);
  const doneNow = pool.filter(x=>state.items[x.id]).length;
  const total = Math.max(pool.length, doneNow+1);
  root.innerHTML = `
    <div class="game">${topBar(`<span class="chip">${doneNow+1} / ${total}</span>`)}
      <div class="card gold qcard">
        ${q.k==='p'
          ? `<div><span class="cite">Según la Reina Valera 1960, en el libro de Daniel, este personaje:</span><p class="whoami">¿Quién soy?</p><ul class="clues">${q.cl.map((c,i)=>`<li>${esc(c)} <span class="src">${esc(srcOf(q.rf[i]))}</span></li>`).join('')}</ul></div>`
          : `<div><span class="cite">Según la Reina Valera 1960, en el capítulo ${q.c}, versículo ${q.v},</span><p class="qtext">${esc(q.q)}</p></div>`}
        <div class="ring" id="ring" role="timer" aria-label="Tiempo restante"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="44"/><circle class="bar" id="ringBar" cx="50" cy="50" r="44"/></svg><b id="ringNum">${G.secs}</b></div>
      </div>
      <div class="opts" id="opts">${G.opts.map((o,i)=>`<button class="opt" type="button" data-i="${i}"><span class="ltr">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>
    </div>`;
  $$('.opt', root).forEach(b => b.addEventListener('click', () => finalize(G.opts[+b.dataset.i], false)));
  updateTick();
}
function startTick(){ stopTick(); G.tick = setInterval(updateTick, 200); }
function updateTick(){
  if (G.phase!=='question') return;
  const left = (G.deadline - Date.now())/1000;
  if (left <= 0) { finalize(null, true); return; }
  const ring=$('#ring'), bar=$('#ringBar'), num=$('#ringNum'); if(!ring) return;
  bar.style.strokeDashoffset = String(276.46*(1-Math.max(0, Math.min(1, left/G.secs))));
  num.textContent = String(Math.ceil(left));
  ring.classList.toggle('low', left<=8);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) updateTick(); });
document.addEventListener('keydown', ev => {
  if (!R.game) return;
  if (G.phase==='question') { const i = ['1','2','3','4'].indexOf(ev.key); if (i>-1 && G.opts[i]) finalize(G.opts[i], false); }
  else if (G.phase==='feedback' && ev.key==='Enter') { const b=$('#nextBtn'); if (b && document.activeElement!==b) b.click(); }
});

async function finalize(pick, timedOut){
  if (G.phase!=='question' && G.phase!=='sending') return;
  stopTick();
  if (Date.now() >= G.deadline) { timedOut = true; pick = null; }
  G.phase = 'sending';
  $$('.opt').forEach(b => { b.disabled = true; if (G.opts[+b.dataset.i]===pick) b.classList.add('picked'); });
  let j = null, lastErr = null;
  for (let i=0;i<3 && !j;i++) {
    try { j = await api(timedOut ? 'timeout' : 'answer', { qid:G.q.id, token:G.token, pick }); }
    catch(e){ lastErr = e; if (!e.network && e.code!=='not_yet') break; await sleep(e.code==='not_yet' ? 1200 : 900); }
  }
  if (!j) {
    $('#v-juego').innerHTML = `<div class="game"><div class="card center stack"><h2>No se guardó tu respuesta</h2><p class="muted">${lastErr && lastErr.network ? 'Parece que no hay internet.' : esc((lastErr&&lastErr.message)||'Error')}</p><button class="btn" id="retryBtn" type="button">Reintentar</button></div></div>`;
    $('#retryBtn').addEventListener('click', () => { G.phase='question'; finalize(pick, timedOut); });
    return;
  }
  lsSet('pd_cur', null);
  applyMe(j.me); state.items[G.q.id] = j.item;
  G.phase = 'feedback';
  G.last = { q:G.q, item:j.item, pick:j.item.to ? null : pick, opts:G.opts, correct:j.correct, reveal:j.reveal };
  renderFeedback();
}
function renderFeedback(){
  const root = $('#v-juego'); const { q, item, pick, opts, correct, reveal } = G.last;
  const left = poolFor(q.k, q.lv).filter(x=>!state.items[x.id]).length;
  const title = item.ok ? '¡Correcto!' : item.to ? '¡Se acabó el tiempo!' : 'No fue esa';
  root.innerHTML = `
    <div class="game fade">${topBar()}
      <div class="card gold stack" style="gap:14px">
        <div class="verdict ${item.ok?'ok':'bad'}">${LION('lion')}<div><h2>${title}</h2><p class="muted">${item.ok?'+'+item.pts+' puntos':'0 puntos'}</p></div></div>
        <div class="opts">${opts.map((o,i)=>`<div class="opt ${o===correct?'right':(o===pick?'wrong':'dim')}"><span class="ltr">${'ABCD'[i]}</span><span>${esc(o)}${o===correct?' <span class="sr">(respuesta correcta)</span>':''}${o===pick&&o!==correct?' <span class="sr">(tu respuesta)</span>':''}</span></div>`).join('')}</div>
        ${q.k==='p' && reveal
          ? `<div class="whois"><span class="muted small">Era</span><b>${esc(correct)}</b><p>${esc(reveal.d)}</p></div><div class="verse"><span class="ref">Daniel ${esc(reveal.kv.r)}</span>«${esc(reveal.kv.t)}»</div>`
          : `<div class="verse"><span class="ref">Daniel ${q.c}:${q.v}</span>«${esc(q.t)}»</div>`}
        <p class="err" id="startErr" role="alert" ${G.err?'':'hidden'}>${esc(G.err)}</p>
        <button class="btn big" id="nextBtn" type="button">${left>0?'Siguiente':'Ver resultado'}</button>
        <p class="credit">Reina-Valera 1960® © Sociedades Bíblicas en América Latina, 1960.</p>
      </div>
    </div>`;
  const nb = $('#nextBtn'); nb.focus({preventScroll:true});
  nb.addEventListener('click', () => {
    const nxt = nextQuestion();
    if (nxt && isOpen(q.k)) { G.err=''; beginQuestion(nxt); } else { G.last=null; G.phase='idle'; refresh(); renderGame(); }
  });
}
function renderDone(pool){
  const items = pool.map(q=>state.items[q.id]).filter(Boolean);

  const ok = it.filter(x=>x.ok).length, to = it.filter(x=>x.to).length;

      <div class="row" style="justify-content:space-between"><h2 id="hPl">Quién respondió qué</h2><button class="btn ghost small" id="csvBtn" type="button">Descargar CSV</button></div>
      ${ranked.length ? `<div class="tablewrap"><table>
        <thead><tr><th>Lugar</th><th>Jugador</th><th>Equipo</th><th class="num">Bien</th><th class="num">Mal</th><th class="num">Sin tiempo</th><th class="num">Puntos</th><th></th></tr></thead>
        <tbody>${ranked.map(p=>{ const o=openRows.has(p.id); return `
          <tr class="pl"><td>${p.pts>0?ord(p.rank):'–'}</td><td><button class="xbtn" type="button" data-x="${esc(p.id)}" aria-expanded="${o}">${o?'▾':'▸'} ${esc(p.name)}</button></td><td>${esc(teamById(p.team).name)}</td><td class="num">${p.s.ok}</td><td class="num">${p.s.bad}</td><td class="num">${p.s.to}</td><td class="num"><b>${p.pts}</b></td><td><button class="btn ghost small" type="button" data-del="${esc(p.id)}">${delAsk===p.id?'¿Seguro?':'Quitar'}</button></td></tr>
          ${o ? `<tr><td colspan="8">${detailHtml(p.s.a)}</td></tr>`:''}`; }).join('')}
        </tbody></table></div>` : '<div class="empty"><p>Todavía nadie ha respondido.</p></div>'}
      <p class="muted small">Solo tú ves esta tabla.</p>
    </section>
    <section class="card stack" style="gap:14px" aria-labelledby="hHard"><h2 id="hHard">Lo que más se falla</h2>
      ${per.length ? `<div class="hard">${per.map(x=>`<div class="hrow"><b>${esc(qLabel(x.q))}</b><div class="meter" aria-hidden="true"><i style="width:${Math.round(x.pct*100)}%"></i></div><span class="muted">${x.ok} de ${x.n}</span></div>`).join('')}</div>` : '<p class="muted">Aparecerá cuando haya respuestas.</p>'}
    </section>`;
  $$('[data-x]', host).forEach(b => b.addEventListener('click', () => { const id=b.dataset.x; if (openRows.has(id)) openRows.delete(id); else openRows.add(id); renderPanelData(); }));
  $$('[data-del]', host).forEach(b => b.addEventListener('click', async () => {
    const id = b.dataset.del;
    if (delAsk !== id) { delAsk = id; renderPanelData(); return; }
    delAsk = '';
    try { await api('admin_remove', { id }); toast('Jugador quitado.'); } catch(e){ toast('No se pudo quitar.'); }
    await refreshAdmin();
  }));
  const cb = $('#csvBtn'); if (cb) cb.addEventListener('click', exportCsv);
}
function detailHtml(a){
  const order = QUESTIONS.concat(CARDS).map(q=>q.id);
  const ids = Object.keys(a.items||{}).sort((x,y)=>order.indexOf(x)-order.indexOf(y));
  if (!ids.length) return '<p class="muted small">Todavía no responde nada.</p>';
  return '<div class="detail">'+ids.map(id => { const it=a.items[id], q=qById[id]; if(!q) return '';
    const tag = it.ok ? '<span class="tag ok">✓ Bien</span>' : it.to ? '<span class="tag to">⏱ Sin tiempo</span>' : '<span class="tag bad">✗ Mal</span>';
    return `<div class="drow"><b>${esc(qLabel(q))}</b>${tag}<span>${it.to?'No alcanzó a responder':'Respondió: '+esc(it.pick)}</span><span class="muted" style="text-align:right">${it.sec} s · ${it.pts} pts</span></div>`; }).join('')+'</div>';
}
function exportCsv(){
  const cell = v => { v=String(v==null?'':v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const lines = [['Jugador','Equipo','Pregunta','Resultado','Respuesta','Segundos','Puntos'].join(',')];
  state.players.forEach(a => Object.keys(a.items||{}).forEach(id => { const it=a.items[id], q=qById[id]; if(!q) return;
    lines.push([a.name, teamById(a.team).name, qLabel(q), it.ok?'Bien':it.to?'Sin tiempo':'Mal', it.to?'':it.pick, it.sec, it.pts].map(cell).join(',')); }));
  try {
    const url = URL.createObjectURL(new Blob(['﻿'+lines.join('\n')], { type:'text/csv;charset=utf-8' }));
    const a = document.createElement('a'); a.href = url; a.download = 'resultados-pregunton-daniel.csv'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000); toast('Archivo descargado.');
  } catch(e){ toast('No se pudo descargar.'); }
}

/* ---------- arranque ---------- */
route();
(async function(){ if (state.pin) { try { await api('admin_check'); state.isAdmin = true; } catch(e){ if (e.code==='bad_pin') { state.pin=''; ssSet('pd_pin',''); } } } await refresh(); if (R.name==='panel') { await refreshAdmin(); renderPanelControls(); renderPanelData(); } })();
})();

</script>
</body>
</html>
